<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVH Source Locator — User Manual</title>
<meta name="description" content="NVH Source Locator user manual — full guide with screenshots in 24 languages.">
<!-- This is the canonical landing URL for the user manual.
     The NVH app's "Full user manual" button opens this URL with
     ?lang=XX, where XX is the user's current app language.
     This page reads ?lang= first, falls back to navigator.language,
     validates against the list of locales that have their own
     translated user-guide.html, and redirects to it.
     If the locale isn't supported (or the user disabled JavaScript),
     they get the multilingual landing page at /. -->
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1F2937;
    background: #F8FAFC;
    text-align: center;
    padding: 80px 24px;
    line-height: 1.5;
    min-height: 100vh;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #E5E7EB; background: #0F172A; }
    h1 { color: #00B4D8 !important; }
    .sub { color: #94A3B8 !important; }
    .fallback a { color: #00B4D8 !important; }
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #0F3460;
    margin: 0 0 8px;
  }
  .sub {
    font-size: 14px;
    color: #556;
    margin: 0;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #E5E7EB;
    border-top-color: #00B4D8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 28px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback {
    margin-top: 32px;
    font-size: 13px;
  }
  .fallback a {
    color: #00B4D8;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }
  .fallback a:hover { border-bottom-color: #00B4D8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NVH Source Locator</h1>
  <p class="sub">Opening user manual…</p>
  <div class="spinner" aria-hidden="true"></div>
  <p class="fallback">
    <noscript>
      JavaScript is disabled. <a href="/">Choose your language manually</a>.
    </noscript>
    <span id="manual-link" style="display:none">
      Taking too long? <a href="/" id="picker-link">Pick your language manually</a>.
    </span>
  </p>
</div>

<script>
(function () {
  // Locales that have their own translated user-guide.html.
  // The 6 fallback locales in the app (be, fa, hi, id, ms, tl) are not in
  // this list — users on those locales are routed to /en/ for English docs.
  var SUPPORTED = {
    en: 1, de: 1, es: 1, fr: 1, it: 1, pt: 1, pl: 1, ru: 1, zh: 1,
    cs: 1, sk: 1, hu: 1, hr: 1, bg: 1, sv: 1, no: 1, fi: 1, ro: 1,
    tr: 1, ar: 1, ja: 1, ko: 1, th: 1, vi: 1
  };

  // Step 1: Try the ?lang= query parameter first (passed by the NVH app).
  var params = new URLSearchParams(window.location.search);
  var lang = (params.get('lang') || '').toLowerCase().trim();

  // Step 2: Fall back to browser/system language for direct visitors.
  if (!lang) {
    var nav = (navigator.language || 'en').toLowerCase();
    lang = nav.split('-')[0];
  }

  // Step 3: Validate. Unsupported locales fall through to English.
  if (!SUPPORTED[lang]) lang = 'en';

  // Step 4: Redirect using replace() so this page doesn't appear in
  // browser history — back button takes the user back to the app/site
  // they came from, not to this transient redirect.
  window.location.replace('/' + lang + '/user-guide.html');

  // Safety net: if the redirect somehow stalls for >3 seconds (slow
  // network, blocked redirect, etc.), reveal the manual-link fallback
  // so the user has an out.
  setTimeout(function () {
    var el = document.getElementById('manual-link');
    if (el) el.style.display = '';
  }, 3000);
})();
</script>
</body>
</html>
