<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system,sans-serif">
  <defs>
    <linearGradient id="paywallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F3460"/>
      <stop offset="100%" stop-color="#0a2440"/>
    </linearGradient>
    <linearGradient id="proBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <rect x="0" y="0" width="400" height="700" fill="url(#paywallBg)" stroke="#0F3460" stroke-width="2"/>
  
  <!-- App icon -->
  <rect x="152" y="60" width="96" height="96" fill="#FFFFFF" rx="22"/>
  <text x="200" y="120" text-anchor="middle" fill="#00B4D8" font-size="48">📡</text>
  <rect x="220" y="135" width="40" height="20" fill="url(#proBadgeGrad)" rx="4"/>
  <text x="240" y="150" text-anchor="middle" fill="#78350F" font-size="11" font-weight="700">PRO</text>
  
  <!-- Title -->
  <text x="200" y="190" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Unlock NVH Pro</text>
  <text x="200" y="215" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="13">Full access to all features</text>
  
  <!-- Features list -->
  <g font-size="13" fill="rgba(255,255,255,0.9)">
    <text x="40" y="260">✓ 3-Sensor &amp; 4-Sensor triangulation</text>
    <text x="40" y="288">✓ 3D source location (X, Y, Z)</text>
    <text x="40" y="316">✓ Unlimited measurement history</text>
    <text x="40" y="344">✓ Save custom materials</text>
    <text x="40" y="372">✓ Backup and restore</text>
    <text x="40" y="400">✓ PDF reports with photo annotation</text>
    <text x="40" y="428">✓ Temperature compensation across all tabs</text>
  </g>
  
  <!-- Unlock button -->
  <rect x="40" y="460" width="320" height="56" fill="#00B4D8" rx="8"/>
  <text x="200" y="495" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Unlock Pro — $19.99</text>
  
  <!-- Promo code link -->
  <rect x="40" y="530" width="320" height="44" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="6"/>
  <text x="200" y="557" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">Have a Google Play promo code?</text>
  
  <!-- Promo announcement -->
  <rect x="40" y="585" width="320" height="60" fill="rgba(0,180,216,0.1)" stroke="rgba(0,180,216,0.3)" stroke-width="1" rx="8"/>
  <text x="200" y="608" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">Looking for a discount code?</text>
  <text x="200" y="624" text-anchor="middle" fill="#00B4D8" font-size="12" font-weight="500">Check the Picoscope Forum →</text>
  
  <!-- Support footer -->
  <text x="200" y="673" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">Questions? support@evdiag.net</text>
</svg>
