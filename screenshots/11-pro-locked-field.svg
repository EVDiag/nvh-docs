<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" font-family="-apple-system,sans-serif">
  <rect x="0" y="0" width="500" height="200" fill="#FFFFFF" stroke="#0F3460" stroke-width="2"/>
  
  <text x="20" y="30" fill="#0F3460" font-size="14" font-weight="600">Pro-locked input field</text>
  <text x="20" y="48" fill="#556" font-size="11">A free user sees a gold padlock badge on Pro fields.</text>
  <text x="20" y="62" fill="#556" font-size="11">Tapping the field shows the paywall.</text>
  
  <!-- Pro-locked field -->
  <text x="20" y="100" fill="#556" font-size="12">Sensor spacing B–C</text>
  <rect x="20" y="108" width="200" height="36" fill="rgba(252,211,77,0.08)" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="30" y="132" fill="#0F3460" font-size="14" font-weight="500">45</text>
  
  <!-- Padlock badge (centered) -->
  <rect x="100" y="118" width="60" height="22" fill="url(#proBadgeGrad)" rx="4"/>
  <text x="113" y="134" fill="#78350F" font-size="12">🔒</text>
  <text x="143" y="133" text-anchor="middle" fill="#78350F" font-size="10" font-weight="700">PRO</text>
  
  <defs>
    <linearGradient id="proBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Unit -->
  <rect x="190" y="108" width="30" height="36" fill="#F8FAFC" rx="6"/>
  <text x="205" y="132" text-anchor="middle" fill="#556" font-size="11">cm</text>
  
  <!-- Arrow & explanation -->
  <text x="240" y="125" fill="#889" font-size="11">← tap shows paywall</text>
  
  <!-- 2-Sensor note -->
  <rect x="20" y="160" width="460" height="30" fill="#E1F5EE" stroke="#00B4D8" stroke-width="1" rx="6"/>
  <text x="30" y="180" fill="#0F3460" font-size="11">All 2-Sensor fields are free. Other tabs have selected Pro-locked fields.</text>
</svg>
