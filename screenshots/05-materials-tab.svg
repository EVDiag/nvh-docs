<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system,sans-serif">
  <rect x="0" y="0" width="400" height="700" fill="#F5F7FA" stroke="#0F3460" stroke-width="2"/>
  
  <!-- Top bar -->
  <rect x="0" y="0" width="400" height="50" fill="#0F3460"/>
  <text x="20" y="32" fill="#FFFFFF" font-size="16" font-weight="600">NVH Source Locator</text>
  <text x="368" y="33" fill="#FCD34D" font-size="11" font-weight="700">PRO</text>
  
  <!-- Tab bar -->
  <rect x="0" y="50" width="400" height="40" fill="#FFFFFF"/>
  <rect x="320" y="50" width="60" height="40" fill="#E1F5EE"/>
  <text x="350" y="75" text-anchor="middle" fill="#00B4D8" font-size="10" font-weight="600">Materials</text>
  <line x1="320" y1="89" x2="380" y2="89" stroke="#00B4D8" stroke-width="2"/>
  <text x="30" y="75" text-anchor="middle" fill="#556" font-size="10">2-Sensor</text>
  <text x="90" y="75" text-anchor="middle" fill="#556" font-size="10">3-Sensor</text>
  <text x="190" y="75" text-anchor="middle" fill="#556" font-size="10">4-Sensor</text>
  <text x="280" y="75" text-anchor="middle" fill="#556" font-size="10">3D</text>
  <text x="390" y="75" text-anchor="middle" fill="#556" font-size="10">Help</text>
  
  <!-- Search bar -->
  <rect x="10" y="100" width="380" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="22" y="125" fill="#889" font-size="14">🔍</text>
  <text x="42" y="125" fill="#889" font-size="13">Search materials…</text>
  
  <!-- Favorites section -->
  <text x="20" y="165" fill="#889" font-size="10" font-weight="600">★ FAVORITES</text>
  
  <!-- Aluminium row (with temp compensation active) -->
  <rect x="10" y="175" width="380" height="56" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="200" fill="#0F3460" font-size="14" font-weight="500">Aluminium</text>
  <text x="20" y="216" fill="#889" font-size="10">★ pinned</text>
  <rect x="20" y="222" width="200" height="4" fill="#E5E7EB" rx="2"/>
  <rect x="20" y="222" width="190" height="4" fill="#00B4D8" rx="2"/>
  <text x="380" y="200" text-anchor="end" fill="#0F3460" font-size="13" font-weight="600" font-family="monospace">6,284 m/s</text>
  <text x="380" y="216" text-anchor="end" fill="#889" font-size="10" font-family="monospace">ref 6,320 @ 20°C</text>
  
  <!-- Steel Mild -->
  <rect x="10" y="240" width="380" height="56" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="265" fill="#0F3460" font-size="14" font-weight="500">Steel, Mild (1020)</text>
  <text x="20" y="281" fill="#889" font-size="10">★ pinned</text>
  <rect x="20" y="287" width="200" height="4" fill="#E5E7EB" rx="2"/>
  <rect x="20" y="287" width="177" height="4" fill="#00B4D8" rx="2"/>
  <text x="380" y="265" text-anchor="end" fill="#0F3460" font-size="13" font-weight="600" font-family="monospace">5,860 m/s</text>
  <text x="380" y="281" text-anchor="end" fill="#889" font-size="10" font-family="monospace">ref 5,890 @ 20°C</text>
  
  <!-- Built-in materials header -->
  <text x="20" y="320" fill="#889" font-size="10" font-weight="600">ALL MATERIALS</text>
  
  <!-- Air -->
  <rect x="10" y="330" width="380" height="44" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="355" fill="#0F3460" font-size="14">Air</text>
  <text x="380" y="350" text-anchor="end" fill="#0F3460" font-size="13" font-weight="600" font-family="monospace">343 m/s</text>
  <text x="380" y="365" text-anchor="end" fill="#889" font-size="9" font-style="italic">ref only</text>
  <text x="22" y="367" fill="#889" font-size="9">☆</text>
  
  <!-- Glass -->
  <rect x="10" y="382" width="380" height="44" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="407" fill="#0F3460" font-size="14">Glass (window)</text>
  <text x="380" y="402" text-anchor="end" fill="#0F3460" font-size="13" font-weight="600" font-family="monospace">5,640 m/s</text>
  <text x="380" y="417" text-anchor="end" fill="#889" font-size="9" font-style="italic">ref only</text>
  
  <!-- Copper -->
  <rect x="10" y="434" width="380" height="56" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="459" fill="#0F3460" font-size="14">Copper</text>
  <text x="380" y="459" text-anchor="end" fill="#0F3460" font-size="13" font-weight="600" font-family="monospace">4,624 m/s</text>
  <text x="380" y="475" text-anchor="end" fill="#889" font-size="10" font-family="monospace">ref 4,660 @ 20°C</text>
  
  <!-- Stainless Steel -->
  <rect x="10" y="498" width="380" height="56" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="523" fill="#0F3460" font-size="14">Stainless Steel (304)</text>
  <text x="380" y="523" text-anchor="end" fill="#0F3460" font-size="13" font-weight="600" font-family="monospace">5,716 m/s</text>
  <text x="380" y="539" text-anchor="end" fill="#889" font-size="10" font-family="monospace">ref 5,740 @ 20°C</text>
  
  <!-- Rubber -->
  <rect x="10" y="562" width="380" height="44" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="587" fill="#0F3460" font-size="14">Rubber (natural)</text>
  <text x="380" y="582" text-anchor="end" fill="#0F3460" font-size="13" font-weight="600" font-family="monospace">1,600 m/s</text>
  <text x="380" y="597" text-anchor="end" fill="#889" font-size="9" font-style="italic">ref only</text>
  
  <!-- Annotation legend -->
  <rect x="10" y="620" width="380" height="65" fill="#E1F5EE" stroke="#00B4D8" stroke-width="1" rx="6"/>
  <text x="20" y="640" fill="#0F3460" font-size="11" font-weight="600">📌 Temperature compensation active (60 °C)</text>
  <text x="20" y="658" fill="#0F3460" font-size="10">14 metals adjust their speed automatically.</text>
  <text x="20" y="673" fill="#0F3460" font-size="10">"ref only" = no compensation available for this material.</text>
</svg>
