<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system,sans-serif">
  <rect x="0" y="0" width="400" height="700" fill="#F5F7FA" stroke="#0F3460" stroke-width="2"/>
  
  <!-- Top bar -->
  <rect x="0" y="0" width="400" height="50" fill="#0F3460"/>
  <text x="20" y="32" fill="#FFFFFF" font-size="16" font-weight="600">Settings</text>
  <text x="378" y="32" text-anchor="end" fill="#FFFFFF" font-size="20">×</text>
  
  <!-- Upgrade to Pro card -->
  <rect x="10" y="65" width="380" height="80" fill="#0F3460" rx="8"/>
  <text x="20" y="93" fill="#00B4D8" font-size="13" font-weight="600">UPGRADE TO PRO</text>
  <text x="20" y="115" fill="#FFFFFF" font-size="12">Unlock advanced modes, history, custom</text>
  <text x="20" y="130" fill="#FFFFFF" font-size="12">materials, backup, photo annotation</text>
  <rect x="280" y="95" width="100" height="36" fill="#00B4D8" rx="6"/>
  <text x="330" y="118" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">$19.99</text>
  
  <!-- Language -->
  <rect x="10" y="160" width="380" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="180" fill="#889" font-size="10" font-weight="600">LANGUAGE</text>
  <text x="20" y="205" fill="#0F3460" font-size="14">English</text>
  <text x="370" y="205" text-anchor="end" fill="#889" font-size="13">▼</text>
  
  <!-- Theme -->
  <rect x="10" y="235" width="380" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="255" fill="#889" font-size="10" font-weight="600">THEME</text>
  <rect x="20" y="265" width="80" height="20" fill="#E1F5EE" rx="4"/>
  <text x="60" y="279" text-anchor="middle" fill="#00B4D8" font-size="11" font-weight="600">Auto</text>
  <rect x="110" y="265" width="80" height="20" fill="#F8FAFC" rx="4"/>
  <text x="150" y="279" text-anchor="middle" fill="#556" font-size="11">Light</text>
  <rect x="200" y="265" width="80" height="20" fill="#F8FAFC" rx="4"/>
  <text x="240" y="279" text-anchor="middle" fill="#556" font-size="11">Dark</text>
  
  <!-- Distance unit -->
  <rect x="10" y="310" width="380" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="330" fill="#889" font-size="10" font-weight="600">DISTANCE UNIT</text>
  <rect x="20" y="340" width="60" height="20" fill="#0F3460" rx="4"/>
  <text x="50" y="354" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">cm</text>
  <rect x="90" y="340" width="60" height="20" fill="#F8FAFC" rx="4"/>
  <text x="120" y="354" text-anchor="middle" fill="#556" font-size="11">in</text>
  
  <!-- Reference temperature (highlighted) -->
  <rect x="10" y="385" width="380" height="135" fill="#FFFFFF" stroke="#00B4D8" stroke-width="1.5" rx="6"/>
  <text x="20" y="405" fill="#889" font-size="10" font-weight="600">REFERENCE TEMPERATURE</text>
  <text x="20" y="423" fill="#889" font-size="10" font-style="italic">Resets to 20 °C on next app launch</text>
  
  <!-- Stepper -->
  <rect x="20" y="438" width="30" height="32" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" rx="4"/>
  <text x="35" y="459" text-anchor="middle" fill="#0F3460" font-size="14" font-weight="600">−</text>
  <rect x="55" y="438" width="80" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="95" y="459" text-anchor="middle" fill="#0F3460" font-size="14" font-weight="500">60</text>
  <rect x="140" y="438" width="30" height="32" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" rx="4"/>
  <text x="155" y="459" text-anchor="middle" fill="#0F3460" font-size="14" font-weight="600">+</text>
  <rect x="180" y="438" width="40" height="32" fill="#E1F5EE" stroke="#00B4D8" stroke-width="1" rx="4"/>
  <text x="200" y="459" text-anchor="middle" fill="#00B4D8" font-size="12" font-weight="600">°C</text>
  
  <text x="20" y="495" fill="#556" font-size="10">Used for temperature-compensated material</text>
  <text x="20" y="510" fill="#556" font-size="10">speeds. Always calibrate in-situ for best accuracy.</text>
  
  <!-- Report header -->
  <rect x="10" y="535" width="380" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="555" fill="#889" font-size="10" font-weight="600">REPORT HEADER</text>
  <text x="20" y="580" fill="#0F3460" font-size="12">EVDiag NVH Lab — Project X-7</text>
  <text x="370" y="580" text-anchor="end" fill="#889" font-size="13">✎</text>
  
  <!-- Backup row -->
  <rect x="10" y="610" width="185" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="20" y="635" fill="#0F3460" font-size="12" font-weight="500">💾 Backup</text>
  <text x="20" y="655" fill="#889" font-size="10">Export all data</text>
  
  <rect x="205" y="610" width="185" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="215" y="635" fill="#0F3460" font-size="12" font-weight="500">📂 Restore</text>
  <text x="215" y="655" fill="#889" font-size="10">Import backup</text>
</svg>
