<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system,sans-serif">
  <rect x="0" y="0" width="400" height="700" fill="#000000" stroke="#0F3460" stroke-width="2"/>
  
  <!-- Photo placeholder (gray) -->
  <rect x="0" y="50" width="400" height="600" fill="#3a3a3a"/>
  
  <!-- Simulated metal surface -->
  <polygon points="0,250 400,200 400,500 0,550" fill="#5a5a5a" opacity="0.8"/>
  <text x="200" y="375" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="16" font-style="italic">[Your photo here]</text>
  <text x="200" y="395" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="12">e.g., engine bay, panel, structure</text>
  
  <!-- Top bar -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.85)"/>
  <text x="20" y="32" fill="#FFFFFF" font-size="15" font-weight="600">Annotate photo</text>
  <text x="378" y="32" text-anchor="end" fill="#FFFFFF" font-size="20">×</text>
  
  <!-- Sensor markers -->
  <g>
    <circle cx="100" cy="450" r="22" fill="rgba(15,52,96,0.95)" stroke="#FFFFFF" stroke-width="2"/>
    <text x="100" y="457" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">A</text>
  </g>
  <g>
    <circle cx="320" cy="430" r="22" fill="rgba(15,52,96,0.95)" stroke="#FFFFFF" stroke-width="2"/>
    <text x="320" y="437" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">B</text>
  </g>
  <g>
    <circle cx="210" cy="280" r="22" fill="rgba(15,52,96,0.95)" stroke="#FFFFFF" stroke-width="2"/>
    <text x="210" y="287" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">C</text>
  </g>
  
  <!-- Source -->
  <g>
    <circle cx="200" cy="385" r="20" fill="rgba(0,180,216,0.3)"/>
    <circle cx="200" cy="385" r="12" fill="#00B4D8"/>
    <text x="200" y="365" text-anchor="middle" fill="#00B4D8" font-size="11" font-weight="600">SOURCE</text>
  </g>
  
  <!-- Distance lines -->
  <line x1="200" y1="385" x2="100" y2="450" stroke="#00B4D8" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
  <line x1="200" y1="385" x2="320" y2="430" stroke="#00B4D8" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
  <line x1="200" y1="385" x2="210" y2="280" stroke="#00B4D8" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
  
  <!-- Distance labels -->
  <rect x="125" y="412" width="50" height="20" fill="rgba(255,255,255,0.95)" stroke="#00B4D8" stroke-width="1" rx="10"/>
  <text x="150" y="426" text-anchor="middle" fill="#0F3460" font-size="11" font-weight="600">18 cm</text>
  
  <rect x="255" y="402" width="50" height="20" fill="rgba(255,255,255,0.95)" stroke="#00B4D8" stroke-width="1" rx="10"/>
  <text x="280" y="416" text-anchor="middle" fill="#0F3460" font-size="11" font-weight="600">22 cm</text>
  
  <rect x="180" y="320" width="50" height="20" fill="rgba(255,255,255,0.95)" stroke="#00B4D8" stroke-width="1" rx="10"/>
  <text x="205" y="334" text-anchor="middle" fill="#0F3460" font-size="11" font-weight="600">19 cm</text>
  
  <!-- Bottom toolbar -->
  <rect x="0" y="650" width="400" height="50" fill="rgba(0,0,0,0.85)"/>
  <rect x="20" y="660" width="100" height="32" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="6"/>
  <text x="70" y="681" text-anchor="middle" fill="#FFFFFF" font-size="13">Retake</text>
  
  <rect x="280" y="660" width="100" height="32" fill="#00B4D8" rx="6"/>
  <text x="330" y="681" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Save</text>
  
  <!-- Hint -->
  <text x="200" y="630" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">Drag any marker to fine-tune position</text>
</svg>
