<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="-apple-system,sans-serif">
  <rect x="0" y="0" width="400" height="400" fill="#FFFFFF" stroke="#0F3460" stroke-width="2"/>
  <text x="20" y="28" fill="#0F3460" font-size="14" font-weight="600">Result visualization</text>
  
  <!-- Triangle -->
  <polygon points="80,320 320,320 200,80" fill="rgba(0,180,216,0.05)" stroke="#00B4D8" stroke-width="1.5"/>
  
  <!-- Sensors -->
  <circle cx="80" cy="320" r="10" fill="#0F3460"/>
  <text x="80" y="346" text-anchor="middle" fill="#0F3460" font-size="14" font-weight="700">A</text>
  
  <circle cx="320" cy="320" r="10" fill="#0F3460"/>
  <text x="320" y="346" text-anchor="middle" fill="#0F3460" font-size="14" font-weight="700">B</text>
  
  <circle cx="200" cy="80" r="10" fill="#0F3460"/>
  <text x="200" y="70" text-anchor="middle" fill="#0F3460" font-size="14" font-weight="700">C</text>
  
  <!-- Source -->
  <circle cx="170" cy="220" r="14" fill="rgba(0,180,216,0.3)"/>
  <circle cx="170" cy="220" r="7" fill="#00B4D8"/>
  <text x="170" y="200" text-anchor="middle" fill="#00B4D8" font-size="11" font-weight="600">SOURCE</text>
  
  <!-- Distance lines -->
  <line x1="170" y1="220" x2="80" y2="320" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="170" y1="220" x2="320" y2="320" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="170" y1="220" x2="200" y2="80" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Distance labels -->
  <rect x="100" y="260" width="60" height="20" fill="#FFFFFF" stroke="#00B4D8" rx="10"/>
  <text x="130" y="274" text-anchor="middle" fill="#0F3460" font-size="11">13 cm</text>
  
  <rect x="220" y="260" width="60" height="20" fill="#FFFFFF" stroke="#00B4D8" rx="10"/>
  <text x="250" y="274" text-anchor="middle" fill="#0F3460" font-size="11">22 cm</text>
  
  <rect x="170" y="130" width="60" height="20" fill="#FFFFFF" stroke="#00B4D8" rx="10"/>
  <text x="200" y="144" text-anchor="middle" fill="#0F3460" font-size="11">19 cm</text>
  
  <!-- Axis labels -->
  <text x="200" y="380" text-anchor="middle" fill="#889" font-size="10">↕ drag to pan, pinch to zoom</text>
</svg>
