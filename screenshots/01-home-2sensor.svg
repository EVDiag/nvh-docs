<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" font-family="-apple-system,sans-serif">
  <!-- Phone frame -->
  <rect x="0" y="0" width="400" height="700" fill="#F5F7FA" stroke="#0F3460" stroke-width="2"/>
  
  <!-- Top bar -->
  <rect x="0" y="0" width="400" height="50" fill="#0F3460"/>
  <text x="20" y="32" fill="#FFFFFF" font-size="16" font-weight="600">NVH Source Locator</text>
  <text x="335" y="33" fill="#00B4D8" font-size="13" font-weight="600">⚙</text>
  <text x="368" y="33" fill="#FCD34D" font-size="11" font-weight="700">PRO</text>
  
  <!-- Tab bar -->
  <rect x="0" y="50" width="400" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="0" y="50" width="60" height="40" fill="#E1F5EE"/>
  <text x="30" y="75" text-anchor="middle" fill="#00B4D8" font-size="10" font-weight="600">2-Sensor</text>
  <text x="90" y="75" text-anchor="middle" fill="#556" font-size="10">3-Sensor</text>
  <text x="140" y="75" text-anchor="middle" fill="#556" font-size="10">3-Sen+</text>
  <text x="190" y="75" text-anchor="middle" fill="#556" font-size="10">4-Sensor</text>
  <text x="240" y="75" text-anchor="middle" fill="#556" font-size="10">4-Sen+</text>
  <text x="280" y="75" text-anchor="middle" fill="#556" font-size="10">3D</text>
  <text x="310" y="75" text-anchor="middle" fill="#556" font-size="10">3D+</text>
  <text x="350" y="75" text-anchor="middle" fill="#556" font-size="10">Materials</text>
  <text x="390" y="75" text-anchor="middle" fill="#556" font-size="10">Help</text>
  <line x1="0" y1="89" x2="60" y2="89" stroke="#00B4D8" stroke-width="2"/>
  
  <!-- Pair tabs -->
  <rect x="10" y="100" width="380" height="34" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <rect x="10" y="100" width="190" height="34" fill="#0F3460" rx="6"/>
  <text x="105" y="123" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Pair A–B</text>
  <text x="295" y="123" text-anchor="middle" fill="#556" font-size="13">Pair A–C</text>
  
  <!-- Card: Step 1 Calibration -->
  <rect x="10" y="150" width="380" height="200" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
  <rect x="10" y="150" width="380" height="34" fill="#F8FAFC" rx="8"/>
  <rect x="20" y="158" width="50" height="18" fill="#00B4D8" rx="9"/>
  <text x="45" y="171" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600">Step 1</text>
  <text x="80" y="172" fill="#0F3460" font-size="13" font-weight="600">Calibration — Speed of Sound</text>
  
  <!-- Distance field -->
  <text x="20" y="205" fill="#556" font-size="12">Sensor spacing A–B</text>
  <rect x="20" y="212" width="200" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="30" y="234" fill="#0F3460" font-size="14" font-weight="500">30</text>
  <rect x="190" y="212" width="30" height="32" fill="#F8FAFC" rx="6"/>
  <text x="205" y="234" text-anchor="middle" fill="#556" font-size="11">cm</text>
  <text x="230" y="234" fill="#889" font-size="11">tap to set</text>
  
  <!-- Cal time field -->
  <text x="20" y="270" fill="#556" font-size="12">Calibration time delay</text>
  <rect x="20" y="277" width="200" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="30" y="299" fill="#0F3460" font-size="14" font-weight="500">47.5</text>
  <rect x="170" y="277" width="50" height="32" fill="#F8FAFC" rx="6"/>
  <text x="195" y="299" text-anchor="middle" fill="#556" font-size="11">µs</text>
  <text x="230" y="299" fill="#889" font-size="10">6,320 m/s</text>
  <text x="230" y="312" fill="#889" font-size="10">Closest: Aluminium</text>
  
  <!-- Card: Step 2 Event -->
  <rect x="10" y="360" width="380" height="120" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
  <rect x="10" y="360" width="380" height="34" fill="#F8FAFC" rx="8"/>
  <rect x="20" y="368" width="50" height="18" fill="#00B4D8" rx="9"/>
  <text x="45" y="381" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600">Step 2</text>
  <text x="80" y="382" fill="#0F3460" font-size="13" font-weight="600">Event Measurement</text>
  
  <text x="20" y="415" fill="#556" font-size="12">Event time delay</text>
  <rect x="20" y="422" width="200" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <text x="30" y="444" fill="#0F3460" font-size="14" font-weight="500">12.3</text>
  <rect x="170" y="422" width="50" height="32" fill="#F8FAFC" rx="6"/>
  <text x="195" y="444" text-anchor="middle" fill="#556" font-size="11">µs</text>
  <text x="20" y="470" fill="#889" font-size="11">A heard first (positive)</text>
  
  <!-- Result card -->
  <rect x="10" y="490" width="380" height="120" fill="#0F3460" rx="8"/>
  <text x="20" y="515" fill="#FFFFFF" font-size="11" font-weight="500">RESULT</text>
  <text x="20" y="555" fill="#00B4D8" font-size="32" font-weight="700">19.2 cm</text>
  <text x="20" y="580" fill="#FFFFFF" font-size="12">from sensor A</text>
  <text x="20" y="598" fill="rgba(255,255,255,0.7)" font-size="11">10.8 cm from sensor B · closer to A</text>
  
  <!-- Action buttons -->
  <rect x="10" y="625" width="180" height="40" fill="#FFFFFF" stroke="#0F3460" stroke-width="1.5" rx="6"/>
  <text x="100" y="650" text-anchor="middle" fill="#0F3460" font-size="13" font-weight="500">Print result</text>
  <rect x="210" y="625" width="180" height="40" fill="#FFFFFF" stroke="#0F3460" stroke-width="1.5" rx="6"/>
  <text x="300" y="650" text-anchor="middle" fill="#0F3460" font-size="13" font-weight="500">📷 Annotate photo</text>
</svg>
