<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" font-family="-apple-system,sans-serif">
  <rect x="0" y="0" width="600" height="120" fill="#FFFFFF"/>
  <text x="20" y="30" fill="#0F3460" font-size="13" font-weight="600">Tab bar (scrolls horizontally on narrow screens)</text>
  
  <!-- Tab bar -->
  <rect x="20" y="50" width="560" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  
  <!-- Active tab -->
  <rect x="20" y="50" width="68" height="40" fill="#E1F5EE" rx="6"/>
  <text x="54" y="75" text-anchor="middle" fill="#00B4D8" font-size="11" font-weight="600">2-Sensor</text>
  <line x1="20" y1="89" x2="88" y2="89" stroke="#00B4D8" stroke-width="2"/>
  
  <!-- Other tabs -->
  <text x="116" y="75" text-anchor="middle" fill="#556" font-size="11">3-Sensor</text>
  <text x="172" y="75" text-anchor="middle" fill="#556" font-size="11">3-Sen+</text>
  <text x="228" y="75" text-anchor="middle" fill="#556" font-size="11">4-Sensor</text>
  <text x="284" y="75" text-anchor="middle" fill="#556" font-size="11">4-Sen+</text>
  <text x="332" y="75" text-anchor="middle" fill="#556" font-size="11">3D</text>
  <text x="372" y="75" text-anchor="middle" fill="#556" font-size="11">3D+</text>
  <text x="430" y="75" text-anchor="middle" fill="#556" font-size="11">Materials</text>
  <text x="500" y="75" text-anchor="middle" fill="#556" font-size="11">Help</text>
  
  <!-- Annotations -->
  <text x="54" y="115" text-anchor="middle" fill="#00B4D8" font-size="9">free</text>
  <text x="116" y="115" text-anchor="middle" fill="#889" font-size="9">partial</text>
  <text x="172" y="115" text-anchor="middle" fill="#889" font-size="9">partial</text>
  <text x="228" y="115" text-anchor="middle" fill="#889" font-size="9">partial</text>
  <text x="284" y="115" text-anchor="middle" fill="#889" font-size="9">partial</text>
  <text x="332" y="115" text-anchor="middle" fill="#889" font-size="9">partial</text>
  <text x="372" y="115" text-anchor="middle" fill="#889" font-size="9">partial</text>
</svg>
